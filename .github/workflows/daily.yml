name: daily-prices
on:
  schedule:
    - cron: "0 12 * * *"   # 07:00 hora de Lima, todos los días
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && playwright install chromium
      - name: Buscar precios
        run: python main.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
      - name: Generar la web
        run: if [ -f build_site.py ]; then python build_site.py; fi
      - name: Guardar historial
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "precios $(date -u +%F)"
          git push
      - name: Publicar en GitHub Pages
        if: hashFiles('site/index.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
