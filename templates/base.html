<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}Precios bebé{% endblock %}</title>
<style>
:root {
  --bg: #f6f5f2; --surface: #ffffff; --text: #1d1d1b; --muted: #6b6a66; --line: #e3e1db;
  --accent: #1f5fbf; --accent-text: #ffffff;
  --verde: #1e7d45; --verde-bg: #e3f4ea; --amarillo: #8a5a00; --amarillo-bg: #fdf1d6;
  --rojo: #b3261e; --rojo-bg: #fbe6e4; --gris: #5f5e5a; --gris-bg: #ecebe7;
  --baja: #1e7d45; --sube: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141413; --surface: #1f1f1d; --text: #ecebe7; --muted: #a3a29c; --line: #34332f;
    --accent: #6ea2ff; --accent-text: #0d1a33;
    --verde: #6fd39a; --verde-bg: #173826; --amarillo: #f2c260; --amarillo-bg: #3a2d0e;
    --rojo: #ff8a80; --rojo-bg: #43201d; --gris: #b5b4ae; --gris-bg: #2c2b28;
    --baja: #6fd39a; --sube: #ff8a80;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); }
.wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
header.top h1 { font-size: 1.3rem; margin: 0 0 4px; }
.meta { color: var(--muted); font-size: .85rem; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: .75rem; font-weight: 600;
  white-space: nowrap; }
.pill.VERDE { background: var(--verde-bg); color: var(--verde); }
.pill.AMARILLO { background: var(--amarillo-bg); color: var(--amarillo); }
.pill.ROJO { background: var(--rojo-bg); color: var(--rojo); }
.pill.SIN { background: var(--gris-bg); color: var(--gris); }
.tag { display: inline-block; font-size: .7rem; padding: 1px 6px; border-radius: 4px; background: var(--gris-bg);
  color: var(--gris); margin-left: 4px; white-space: nowrap; }
.tag.aviso { background: var(--amarillo-bg); color: var(--amarillo); }
.btn { display: inline-block; background: var(--accent); color: var(--accent-text); text-decoration: none;
  padding: 7px 12px; border-radius: 8px; font-weight: 600; font-size: .85rem; white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.baja { color: var(--baja); } .sube { color: var(--sube); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
footer { color: var(--muted); font-size: .8rem; margin: 24px 0 8px; }
{% block css %}{% endblock %}
</style>
</head>
<body>
<div class="wrap">
{% block body %}{% endblock %}
<footer>Generado {{ generado or fecha }} · Tipo de cambio {{ tc }}{% if tc_fuente != "SUNAT" %} (fijo, SUNAT no respondió){% else %} SUNAT{% endif %}</footer>
</div>
{% block js %}{% endblock %}
</body>
</html>
