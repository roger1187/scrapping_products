# Un producto por bloque. Campos:
#   id, marca, nombre        obligatorios
#   usa                      texto de búsqueda para TODAS las tiendas de EE.UU.
#   lima                     texto de búsqueda para las tiendas de Lima
#   precio_lima_manual       precio de referencia en soles si no hay resultados en Lima (estimado, revísalo)
#   brand_url (opcional)     URL exacta del producto en la web oficial de la marca
#   size / pack (opcional)   texto que el título debe contener
#   requiere (opcional)      palabras que el título de EE.UU. debe contener; "a|b" = cualquiera de las dos
#   requiere_lima (opcional) lo mismo para Lima (sin tildes ni mayúsculas). Evitan que un accesorio barato de la
#                            misma marca (medias, estuche, juguete) gane o fije la referencia de Lima.
